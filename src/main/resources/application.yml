server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: insurance-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insurance_portal}
    username: ${DB_USERNAME:insurance_user}
    password: ${DB_PASSWORD:insurance_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-for-jwt-signing-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.insurance.portal: INFO
    org.hibernate.SQL: WARN
