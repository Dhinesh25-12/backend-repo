version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: insurance-portal-db
    environment:
      POSTGRES_DB: insurance_portal
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
    ports:
      - "5432:5432"
    volumes:
      - insurance_portal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-portal-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/insurance_portal
      DB_USERNAME: insurance_user
      DB_PASSWORD: insurance_pass
      JWT_SECRET: change-this-super-secret-key-for-jwt-signing-please-1234567890
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  insurance_portal_data:
